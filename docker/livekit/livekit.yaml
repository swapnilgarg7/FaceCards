# Local development LiveKit server.
#
# These keys are development-only and are committed on purpose so `npm run
# livekit:up` works with no setup. They must never appear in a deployed
# environment: production keys come from LiveKit Cloud (or your own host) and
# live only in the server's environment.
port: 7880
bind_addresses:
  - 0.0.0.0

rtc:
  # A fixed, small UDP range keeps the compose port mapping honest. Wider is
  # better in production; here it only has to carry a few local tabs.
  port_range_start: 50000
  port_range_end: 50019
  tcp_port: 7881
  # Everything is on this machine, so no external IP discovery is needed and
  # skipping it removes a startup network round trip.
  use_external_ip: false

# Deliberately no `limit:` block here.
#
# It looks like the place to cap the data channel that face framing rides on
# (see server/src/livekit/token.ts), and it is not: `limit.bytes_per_sec` is
# node-level admission control covering *all* traffic, media included. Setting
# it to anything a data channel would need is far below what one 540p video
# stream uses, so the node immediately reports itself over capacity and refuses
# every new connection with a 503 and "node has exceeded its configured limit".
# It only fails once video actually flows, so a server that starts cleanly
# proves nothing.
#
# LiveKit has no per-participant data rate setting. The rate limit that matters
# lives on the receiving client, in LiveKitProvider.handleData.

keys:
  devkey: devsecretdevsecretdevsecretdevsecret

logging:
  level: info
